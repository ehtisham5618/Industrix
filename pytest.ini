[pytest]
# Validate source tests, never cached restore clones or runtime environments.
norecursedirs = runtime backups .git .pytest_cache venv .venv node_modules
# Existing CME-OPT2 tests import their sibling trainer as a top-level module.
pythonpath = . CME_OPT2_Model_Fine_Tuning
addopts = --import-mode=importlib
