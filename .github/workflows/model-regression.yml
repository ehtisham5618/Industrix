# EAP-2: offline model-regression gate. Model weights and datasets are not stored in
# Git, so hosted CI runs the code/contract/negative-control tests and the registry
# validator; real-model checks report NOT_VERIFIED here and must be run on a machine
# holding the verified artifacts (see docs/EAP_2_CI_Model_Regression.md).
name: model-regression

on:
  pull_request:
  push:
    branches: [master, main, staging, production, "feature/**"]

permissions:
  contents: read

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOLO_OFFLINE: "true"
      YOLO_AUTOINSTALL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install gate dependencies (constrained by requirements.txt pins)
        run: python -m pip install "pydantic>=2.12,<3" "PyYAML>=6.0.0" "numpy>=2.4.0" "psutil>=5.9,<8" "httpx<1" pytest
      - name: Syntax check
        run: python -m compileall -q EAP_2_CI_Model_Regression Experiment_Tracking/scripts
      - name: Registry validation
        run: python Experiment_Tracking/scripts/validate_registry.py
      - name: Regression gate tests
        run: python -m pytest EAP_2_CI_Model_Regression/tests -v -rs -p no:cacheprovider
      - name: Regression report (model artifact absent in CI -> NOT_VERIFIED)
        run: python -m EAP_2_CI_Model_Regression.runner --out reports/eap2/ci_regression_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eap2-regression-report
          path: reports/eap2/ci_regression_report.json

  # EAP-3: container build + strict size gate. CI has no model weights, so it builds the
  # weightless `runtime` target (bundled adds only best.pt + OpenVINO INT8, ~34 MB) and
  # verifies the fail-fast behaviour; real-inference container tests run where weights exist.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build runtime image
        run: docker build --target runtime -t industrix:eap3-runtime .
      - name: Image size gate (< 1.8 GB unpacked, decimal)
        run: python EAP_3_Lightweight_Docker/check_image_size.py industrix:eap3-runtime --out reports/eap3/ci_image_size.json
      - name: Container tests
        env:
          EAP3_RUNTIME_IMAGE: industrix:eap3-runtime
        run: |
          python -m pip install "pydantic>=2.12,<3" pytest pillow
          python -m pytest EAP_3_Lightweight_Docker/tests -v -rs -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eap3-image-size
          path: reports/eap3/ci_image_size.json

  # EAP-4: load-test harness validation only. The six-hour run is opt-in
  # (--confirm-long-run) and never runs in CI; real-service load needs local weights.
  load-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install "pydantic>=2.12,<3" "psutil>=5.9,<8" pytest
      - name: Syntax check
        run: python -m compileall -q EAP_4_Load_Test
      - name: Harness unit and stub-server tests
        run: python -m pytest EAP_4_Load_Test/tests -v -rs -p no:cacheprovider
      - name: Six-hour profile is configured and opt-in
        run: |
          python -c "from EAP_4_Load_Test.config import build_config as b; c=b('six-hour','http://127.0.0.1:8000'); assert c.duration_seconds==21600 and c.thresholds.max_memory_drift_percent==5.0"
          ! python -m EAP_4_Load_Test.run_load_test --profile six-hour --target-url http://127.0.0.1:8000

  # EAP-5: watchdog unit + disposable-service integration tests (POSIX process-group path on Linux).
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install watchdog dependencies
        run: python -m pip install -r EAP_5_Watchdog/requirements.txt pytest
      - name: Setup script syntax
        run: sh -n EAP_5_Watchdog/scripts/setup_watchdog.sh
      - name: Watchdog tests
        run: python -m pytest EAP_5_Watchdog/tests -v -rs -p no:cacheprovider

  # FDD-1: release-regression gap tests (API edge cases, startup, dashboard render, offline imports).
  # Uses EAP-3's pinned CPU runtime set; weight-dependent tests skip with a reason (no weights in Git).
  release-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU runtime + test tools
        run: |
          grep -v '^ultralytics==' EAP_3_Lightweight_Docker/requirements-runtime.txt > /tmp/deps.txt
          python -m pip install -r /tmp/deps.txt "streamlit>=1.63,<2" httpx pytest
          python -m pip install --no-deps "$(grep '^ultralytics==' EAP_3_Lightweight_Docker/requirements-runtime.txt)"
      - name: FDD-1 regression tests
        env:
          YOLO_OFFLINE: "true"
        run: python -m pytest FDD_1_Release_Regression/tests -v -rs -p no:cacheprovider

  # FDD-2: taxonomy manifest vs authoritative configs + documentation checks (no model, no dataset).
  taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install "pydantic>=2.12,<3" "PyYAML>=6.0.0" "psutil>=5.9,<8" pytest
      - name: Taxonomy consistency
        run: python -m FDD_2_Hardware_Taxonomy.taxonomy
      - name: FDD-2 tests
        run: python -m pytest FDD_2_Hardware_Taxonomy/tests -v -rs -p no:cacheprovider

  # FDD-3: handoff package consistency (documented env vars/endpoints/scripts vs code) and
  # deployment-tool tests against local stubs. Backend-import checks skip without the full stack.
  handoff-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pydantic>=2.12,<3" "PyYAML>=6.0.0" "psutil>=5.9,<8" pytest
      - name: FDD-3 tests
        run: python -m pytest FDD_3_Deployment_Handoff/tests -v -rs -p no:cacheprovider

  # FDD-4: demo recorder validation (manifest, preflight, output protection, ffmpeg export checks).
  # The live recording itself needs Edge + the full stack and runs locally, not in CI.
  demo-recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and pytest
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && python -m pip install pytest
      - name: FDD-4 tests
        run: python -m pytest FDD_4_Demo/tests -v -rs -p no:cacheprovider

  demo-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest "pydantic>=2" psutil
      - name: FDD-5 tests
        run: python -m pytest FDD_5_Dry_Run/tests -v -rs -p no:cacheprovider
